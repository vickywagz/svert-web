name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run build

      - name: Notify success
        if: success()
        run: echo "✅ Web build passed — Vercel will auto-deploy"

      - name: Notify failure
        if: failure()
        run: echo "❌ Web build failed — fix before Vercel deploys"